<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Codeforces Analytics — Neo Glass</title>
  <style>
    body {
      width: 280px;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      color: #f7f2ff;
      margin: 0;
      background:
        radial-gradient(500px 300px at 0% 0%, rgba(184,140,255,.16), transparent 62%),
        radial-gradient(400px 250px at 100% 0%, rgba(123,92,255,.12), transparent 65%),
        #0b0a12;
    }
    h3 {
      margin-top: 0;
      color: #f7f2ff;
      text-shadow: 0 0 18px rgba(184,140,255,.35);
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #b9adcf;
    }
    .btn {
      display: block;
      margin-top: 10px;
      padding: 10px;
      color: #fffaff;
      background: linear-gradient(135deg, #b88cff, #7b5cff);
      text-decoration: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      transition: filter 0.2s, transform 0.2s;
      box-shadow: 0 7px 22px rgba(184,140,255,.25), inset 0 1px rgba(255,255,255,.24);
      border: 1px solid rgba(184,140,255,.4);
    }
    .btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(184,140,255,.12);
      color: #dfccff;
      border: 1px solid rgba(190,145,255,.3);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: rgba(184,140,255,.2);
    }
  </style>
</head>
<body>
  <h3 data-i18n="popupTitle">Codeforces Analytics — Neo Glass</h3>
  <p data-i18n="popupDesc">This extension is active! Please visit a Codeforces profile page to view the analytics charts.</p>
  
  <a href="https://codeforces.com" target="_blank" class="btn btn-secondary" data-i18n="btnGoToCF">Go to Codeforces</a>
  <a href="https://codeforces.com/profile/amir1389_gerami" target="_blank" class="btn" data-i18n="btnViewDemo">View Demo</a>

  <p style="margin-top:12px;font-size:11px;opacity:.65">Created by <a href="https://codeforces.com/profile/amir1389_gerami" target="_blank">amir1389_gerami</a> · amirmohammad.grm.8998@gmail.com<br>© amir1389_gerami — unauthorized copying prohibited.</p>

  <script src="popup.js"></script>
</body>
</html>
